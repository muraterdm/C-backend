# Ders Programı uygulamasının Android APK'sını ücretsiz olarak GitHub üzerinde derler.
# Actions sekmesi → "Ders Programı – Android APK" → Run workflow. Bitince APK "Artifacts" altında indirilebilir.
name: Ders Programı – Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ders-programi/**"
      - ".github/workflows/ders-programi-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # APK'yı sürüm (release) olarak yayınlamak için
    defaults:
      run:
        working-directory: ders-programi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ders-programi/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK GitHub'ın ubuntu sunucularında hazır kurulu (ANDROID_HOME)
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ders-programi-apk
          path: ders-programi/android/app/build/outputs/apk/release/*.apk
      - name: APK'yı sabit indirme bağlantısına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk ders-programi.apk
          gh release view ders-programi-apk >/dev/null 2>&1 || \
            gh release create ders-programi-apk --target "$GITHUB_SHA" --title "Ders Programı – Android APK" \
              --notes "Telefondan indir: ders-programi.apk dosyasına dokun, açınca Yükle de (bilinmeyen kaynaklara izin ver). Her derlemede güncellenir."
          gh release upload ders-programi-apk ders-programi.apk --clobber
